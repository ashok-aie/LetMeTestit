[project]
name = "let-me-test-it"
version = "0.1.0"
description = "Agentic Quality Engineering Platform — from requirements to verified results"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "QA Engineering Team" }
]

dependencies = [
    "streamlit>=1.40.0,<2.0.0",
    "playwright>=1.49.0,<1.51.0",
    "langgraph>=0.2.45,<0.3.0",
    "langchain-core>=0.3.0,<0.4.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.5.2,<3.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2,<0.28.0",
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "jinja2>=3.1.4,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast deterministic unit tests",
    "integration: tests interacting with external mocks/APIs",
    "safety: security guardrails and injection penetration tests",
    "browser: Playwright browser tests",
    "e2e: complete end-to-end workflow slice tests",
]

